name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting
        run: |
          nix fmt -- --check $(find . -name '*.nix' -not -path './.git/*' -not -path './.devenv/*' -not -path './.direnv/*')

      - name: Check Router Flake Evaluation
        run: |
          nix build .#nixosConfigurations.router.config.system.build.toplevel --dry-run

      - name: Check Compute Node Flake Evaluation
        run: |
          nix build .#nixosConfigurations.compute.config.system.build.toplevel --dry-run
