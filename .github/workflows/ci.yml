name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting
        run: |
          mapfile -d '' nix_files < <(find . -name '*.nix' -not -path './.git/*' -not -path './.devenv/*' -not -path './.direnv/*' -print0)
          nix fmt -- --check "${nix_files[@]}"

      - name: Check Router Flake Evaluation
        run: |
          nix build .#nixosConfigurations.renate.config.system.build.toplevel --dry-run

      - name: Check Compute Node Flake Evaluation
        run: |
          nix build .#nixosConfigurations.compute0.config.system.build.toplevel --dry-run

      - name: Check Shrek VPS Flake Evaluation
        run: |
          nix build .#nixosConfigurations.shrek.config.system.build.toplevel --dry-run
